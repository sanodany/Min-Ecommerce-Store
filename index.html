<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bitter:wght@500;600&display=swap" rel="stylesheet">
    <title>Mini Ecommerce Store</title>
    <link rel="stylesheet" href="styles/styles.css" />
</head>
<body>

<div class="upper-div">
  <p class="store-name">tech+</p>
  <div>
    <button class="shop-btn">
     Shop
  </button>
    <button class="header-btns">
      About
    </button>
    <button class="header-btns">
      Contact
    </button>
  </div>
  <div>
    <button class="header-btns">
      Account
    </button>
    <button class="header-btns">
      Cart(3)
    </button>
  </div>
</div>
    
<div class="second-div">
  <div class="side-menu">
    <p class="shop-paragraph"> / Shop</p>
    <button class="menu-btns">Lighting</button>
    <button class="menu-btns">Kitchen</button>
    <button class="menu-btns">/ Homewares</button>
    <button class="menu-btns">Audio</button>
    <button class="menu-btns">Wellness</button>
    <button class="menu-btns">Charging</button>
    <button class="menu-btns">Security</button>
  </div>


<div class="products-div">

  <div class="product-div">
    <img src="images/speaker.jpg" class="product-img">
    <p class="product-name">Speaker</p>
    <p class="product-price">$18.99</p>
  </div>

 <div class="product-div">
    <img src="images/iphone.jpeg" class="product-img">
    <p class="product-name">Iphone X</p>
    <p class="product-price">$78.99</p>
  </div>

</div>
</body>
</html>
